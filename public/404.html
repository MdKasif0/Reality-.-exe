<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Coordinate Lost | Reality.exe</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #07070a;
        color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        overflow: hidden;
      }
      .badge {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 9999px;
        background: rgba(0, 240, 255, 0.08);
        border: 1px solid rgba(0, 240, 255, 0.25);
        color: #00f0ff;
        font-family: monospace;
        font-size: 12px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 24px;
      }
      h1 {
        font-size: clamp(3rem, 8vw, 6rem);
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 1;
        margin-bottom: 16px;
        color: #ffffff;
      }
      h1 span {
        color: #00f0ff;
      }
      p {
        max-width: 480px;
        font-size: 16px;
        line-height: 1.6;
        color: #94a3b8;
        margin-bottom: 32px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 14px 28px;
        border-radius: 14px;
        background: #00f0ff;
        color: #07070a;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      .btn:hover {
        background: #38bdf8;
        transform: scale(1.03);
      }
    </style>
  </head>
  <body>
    <div class="badge">404 // SPATIAL COORDINATE UNMAPPED</div>
    <h1>Reality<span>.404</span></h1>
    <p>
      The virtual vector you requested does not exist in this sector of the spatial matrix. Return to the primary workspace to re-anchor your coordinate system.
    </p>
    <a href="/" class="btn">Return to Spatial OS</a>
  </body>
</html>
